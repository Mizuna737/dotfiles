# Local-only broker. Sole purpose: carry teams-for-linux call state to
# meetingWatcher, which starts and stops meeting recordings.
# Loopback only and unauthenticated — it must never be reachable off-box.
listener 1883 127.0.0.1
allow_anonymous true

# Retained messages survive a broker restart, so a watcher that starts
# mid-meeting still learns the current call state instead of waiting for
# the next transition.
persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
