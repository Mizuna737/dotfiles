[settings]
camera = 0
dwellMs = 50
format = "YUYV"
fps = 30
gracePeriodMs = 200
spreadThreshold = 0.4

[presence]
checkHz = 2
enabled = true
idleSeconds = 60
motionThreshold = 5
pauseHandsWhenAbsent = true
poseCheckMode = "fallback"
poseDetection = true
poseMinConfidence = 0.5
useMotionDetection = false

[[poses]]
name = "FIST"
thumb = false
index = false
middle = false
ring = false
pinky = false

[[poses]]
name = "LLAP"
index = true
middle = true
ring = true
pinky = true
spreadIndexMiddle = "close"
spreadMiddleRing = "apart"
spreadRingPinky = "close"

[[poses]]
name = "OPEN_PALM"
thumb = true
index = true
middle = true
ring = true
pinky = true
spreadThumbIndex = "apart"
spreadIndexMiddle = "apart"
spreadMiddleRing = "apart"
spreadRingPinky = "apart"

[[poses]]
name = "FIVE"
thumb = true
index = true
middle = true
ring = true
pinky = true

[[poses]]
name = "SIGN"
thumb = true
index = true
middle = false
ring = false
pinky = true

[[poses]]
name = "THUMBS_UP"
thumb = true
index = false
middle = false
ring = false
pinky = false

[[poses]]
name = "FOUR"
thumb = false
index = true
middle = true
ring = true
pinky = true

[[poses]]
name = "THREE"
thumb = true
index = true
middle = true
ring = false
pinky = false
spreadIndexMiddle = "apart"

[[poses]]
name = "TWO"
thumb = false
index = true
middle = true
ring = false
pinky = false

[[poses]]
name = "ONE"
thumb = false
index = true
middle = false
ring = false
pinky = false

[[poses]]
name = "L"
thumb = true
index = true
middle = false
ring = false
pinky = false

[[poses]]
name = "OK"
index = false
middle = true
ring = true
pinky = true

[[poses]]
name = "Y"
thumb = true
index = false
middle = false
ring = false
pinky = true

[[poses]]
name = "Double L"
thumb = true
index = true
middle = true
ring = false
pinky = false
spreadIndexMiddle = "close"

[[bindings]]
name = "visibleColumns"
require = [{hand = "left", pose = "THREE"}]
trigger = { hand = "left", hysteresis = 0.1, metric = "pinchDistance", range = [0.1, 0.3], type = "continuous" }

[[bindings]]
name = "set_volume"
require = [{hand = "either", pose = "OK"}]
trigger = { hand = "either", metric = "angle", range = [0, 1], type = "continuous" }

[[bindings]]
name = "focusWindow"
require = [{hand = "either", pose = "Double L"}]
trigger = { type = "continuous", metric = "pinchDistance", range = [0.1, 0.2], hysteresis = 0.1, hand = "left" }

[[bindings]]
name = "play_pause"
trigger = { hand = "left", stepDwellMs = 500, steps = ["FIST", "FIVE"], type = "sequence", windowMs = 3000 }

[[bindings]]
name = "rotateColumnsLeft"
require = [{hand = "either", pose = "TWO"}]
trigger = { direction = "left", hand = "either", minDisplacement = 0.3, type = "swipe" }

[[bindings]]
name = "rotateColumnsRight"
require = [{hand = "either", pose = "TWO"}]
trigger = { direction = "right", hand = "either", minDisplacement = 0.1, type = "swipe" }

[[bindings]]
name = "toggleGestureControl"
require = [{hand = "right", pose = "OPEN_PALM"}]
trigger = { hand = "left", stepDwellMs = 80, steps = ["FOUR", "LLAP", "FOUR", "FIST"], type = "sequence", windowMs = 2500 }

[wearable]
# Emits WearableChanged when headphones go on or off the head. Needs presence.poseDetection.
enabled = true
# Consecutive agreeing samples (checkHz per second) before the state flips on
hysteresis = 3
# Samples needed to flip back to off-head. Held to a stricter bar than putting
# them on: a false "took them off" dumps audio to the speakers, while a false
# "put them on" is inaudible. Must exceed the longest observed error run (3).
hysteresisOff = 4
# First argument of the WearableChanged signal
name = "headphones"
# Samples whose top class probability is below this are ignored; 0 uses every sample
minConfidence = 0.0
