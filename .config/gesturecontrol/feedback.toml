# gestureFeedback.py settings. Edits are picked up within about a second.
enabled = true
masterVolume = 0.5        # 0.0 - 1.0
rateLimitPerSec = 15      # global ceiling on ticks per second

[events]
fired = true
continuousStart = true
continuousEnd = true
continuousTick = true     # detent tick per slot crossing
sequenceProgress = true

[detent]
floatDetents = 10         # 0..1 values are bucketed into this many detents
slotGestures = []         # gestures to always treat as slot indices

[suppression]
whenSinkMuted = true
whenCallActive = true     # mic open in a call app (heuristic, see below)
whenScreenShare = true    # a running PipeWire screen-cast stream
callAppPattern = "teams|zoom|webex|skype|slack|discord|vesktop|meet|jitsi"
checkIntervalSec = 2.0

# Per-gesture pitch: Hz or a note name such as "E5". Unlisted gestures get a
# deterministic pitch hashed from the name into a pentatonic scale.
[gestures]
# swipeLeft = "C5"
# pinch = 880
