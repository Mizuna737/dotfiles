[Service]
# Collapse the OpenBLAS thread pool that ships inside the opencv-python wheel.
#
# Its worker threads (blas_thread_server) busy-wait on sched_yield before
# parking, and they never settle: measured at ~673,000 sched_yield/sec, 72% of
# all syscall time, holding ~60% of a core permanently whether or not a camera
# is even connected. Over a fortnight's uptime that came to 1w2d of CPU burned.
# The matting model runs on the GPU via TensorRT, so the BLAS pool buys nothing
# here -- a single thread costs no measurable frame time.
Environment=OPENBLAS_NUM_THREADS=1
Environment=OMP_NUM_THREADS=1
