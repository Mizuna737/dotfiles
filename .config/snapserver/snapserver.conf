[server]
datadir = /home/max/.config/snapserver/

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapserver/snapweb

[tcp-streaming]
bind_to_address = 0.0.0.0
port = 1704

[tcp-control]
bind_to_address = 0.0.0.0
port = 1705

[stream]
plugin_dir = /home/max/.config/snapserver/plug-ins
# Creates a "snapcast" sink; the unit links the BookShare monitor into it.
source = pipe:///run/user/1000/houseAudio/snapMax?name=max&sampleformat=48000:16:2&mode=create&controlscript=pianobarControl.py
source = pipe:///run/user/1000/houseAudio/snapNicole?name=nicole&sampleformat=48000:16:2&mode=create&controlscript=pianobarControl.py
source = pipe:///tmp/snapTest?name=latencyTest&sampleformat=48000:16:2&mode=create
codec = flac
buffer = 3000

[logging]
filter = *:info
