# The built-in bar: a cap drawn along the screen edges. Full edges hold
# modules and push tiled windows inward; Corner edges are short lips that
# round off the inner curve without taking space.
[bar]
enabled = true
top = "Full"
top_thickness = 32
bottom = "Corner"
bottom_thickness = 6
left = "Full"
left_thickness = 20
right = "None"

# How much of the frosted wallpaper shows through the cap.
opacity = 0.75
backdrop_tonemap = true
backdrop_blur = true
refract = true

font = "JetBrainsMono Nerd Font"
font_size = 14

# Which modules sit on each edge. Only Full edges draw modules. Horizontal
# edges run start/center/end left to right; vertical edges run them top to
# bottom.
[bar.modules.top]
start = ["custom.wa_status", "custom.vram_arbiter", "custom.wear_retrain"]
center = ["minimap"]
end = [
  "network",
  "volume",
  "custom.claude_5h",
  "custom.claude_7d",
  "cpu",
  "memory",
  "tray",
  "clock",
]

[bar.modules.bottom]
start = []
center = []
end = []

[bar.modules.left]
start = []
center = ["volume"]
end = []

[bar.modules.right]
start = []
center = []
end = []

# Level bars under cpu/memory glow past SDR white on HDR outputs, brightening
# with load up to this peak.
[bar.cpu]
level_bar_nits = 600

[bar.memory]
level_bar_nits = 600

# Claude plan usage. Turns the emphasis color past 80% and brightens with use.
[bar.custom.claude_5h]
exec = "~/Scripts/claudeUsageBar.py --window five_hour"
level_bar = true
level_bar_nits = 600
emphasis_above = 80
classes = { stale = "#6c7086" }

[bar.custom.claude_7d]
exec = "~/Scripts/claudeUsageBar.py --window seven_day"
level_bar = true
level_bar_nits = 600
emphasis_above = 80
classes = { stale = "#6c7086" }

# Former waybar scripts, carried over unchanged.
[bar.custom.wa_status]
exec = "python3 ~/Projects/rubix/contrib/waybar/waStatus.py"

[bar.custom.vram_arbiter]
exec = "python3 ~/Projects/dotfiles-tools/Scripts/vramArbiterBar.py"

[bar.custom.wear_retrain]
exec = "python3 ~/Projects/dotfiles-tools/Scripts/wearRetrainBar.py"
on_click = "setsid -f ~/.local/share/gesturecontrol/venv/bin/python3 ~/gesturecontrol/tests/retrainWearable.py train"
on_click_right = "setsid -f ~/.local/share/gesturecontrol/venv/bin/python3 ~/gesturecontrol/tests/retrainWearable.py promote"

[bar.network]
level_bar_nits = 600
show_rates = true

[[bar.network.vpn]]
name = "Windscribe"
status = "windscribe-cli status | grep -q 'Connect state: Connected'"
connect = "windscribe-cli connect"
disconnect = "windscribe-cli disconnect"

[bar.volume]
level_bar_nits = 600

# No cap on the strip; it holds the dashboard and the stopgap waybar tray.
[bar.output."HDMI-A-1"]
top = "None"
bottom = "None"
left = "None"
right = "None"

# Bigger cells, one group above and below the active row. A deeper stack
# fades at its tip.
[bar.minimap]
cell_width = 12
cell_height = 7
cell_gap = 3
max_depth = 1

# The map opened from the minimap (right-click or Super+m).
[bar.map]
keys = "Vim"
