# Input devices and keybinds.
#
# Every *.toml under this directory is loaded and merged, so the split
# across files is organisational only -- move things wherever suits you.

[input]
# Hovering a window gives it keyboard focus, instead of requiring a click.
# Live/hot-reloadable: edit + save takes effect immediately. Also flippable at
# runtime via Super+Alt+f (ToggleFocusFollowsMouse) for A/B without a save --
# though a later config save re-seeds the live value from this line.
#
# Inert while a pointer grab is in progress, while any window is fullscreen (so a
# stray hover can't drop a game out of fullscreen), and over layer-shell surfaces
# like the bar or rofi, which keep their own keyboard focus.
focus_follows_mouse = true

# The counterpart to focus_follows_mouse: a keyboard or IPC focus change warps
# the pointer to the centre of the newly focused window, instead of leaving it
# wherever it was. Also flippable at runtime via Super+Alt+m
# (ToggleMouseFollowsFocus), for A/B against Super+Alt+f above.
mouse_follows_focus = true

# Keybinds map a chord to a NavAction variant. The value is the *exact* Rust
# variant name -- serde deserializes it straight into the enum, so there is no
# translation table in code. Chord syntax: modifier tokens (Super/Alt/Ctrl/Shift,
# case-insensitive) joined with '+', ending in an xkb keysym name ("Return", "h").
# Super-based binds for the real TTY session. (Nested dev under a host WM that
# grabs Super uses the Alt-based config/default.toml instead.)
[keybinds]
# Move focus to the nearest window in a direction. These navigate the WHOLE cube:
# past group and column divides, into columns that are off screen (the cube spins
# to bring them in), and wrapping at the far edge -- right from the rightmost
# window lands on the leftmost, down from the bottom row wraps within the column.
"Super+h" = "FocusWindowLeft"
"Super+l" = "FocusWindowRight"
"Super+j" = "FocusWindowDown"
"Super+k" = "FocusWindowUp"
"Super+Return" = { Spawn = "kitty" }
"Super+Shift+H" = "MoveActiveColumnLeft"
"Super+Shift+L" = "MoveActiveColumnRight"
# Relocate the focused window across the group grid: h/l cross columns (landing in
# the destination column's active row), j/k walk rows within the column. j=Down /
# k=Up to match the FocusWindow binds above.
"Super+Control+h" = "MoveFocusedWindowLeft"
"Super+Control+l" = "MoveFocusedWindowRight"
"Super+Control+j" = "MoveFocusedWindowDown"
"Super+Control+k" = "MoveFocusedWindowUp"
# Zoom the cube: more visible columns (narrower bands) / fewer (wider bands).
"Super+Shift+K" = "IncrementVisibleColumns"
"Super+Shift+J" = "DecrementVisibleColumns"
"Super+n" = "NewGroup"
"Super+Shift+N" = "MoveToNewGroupDown"
# Multi-head: step the cursor to the next monitor, or carry the focused window
# over to it. Both wrap, and both no-op on a single head. Order is the
# compositor's monitor list (output discovery order), not spatial left-to-right,
# so on three heads the cycle may not match how they sit on the desk.
"Super+o" = "FocusNextMonitor"
"Super+Shift+O" = "MoveWindowToNextMonitor"
# Flip the focused window's parent split between horizontal and vertical.
"Super+r" = "FlipSplitDirection"
"Super+Shift+space" = { Spawn = "kitty" }
# Launcher. rofi picks its wayland (layer-shell) backend automatically under
# Rubix; the compositor grants it keyboard focus via layer-shell keyboard
# interactivity (see focus_interactive_layer).
"Super+space" = { Spawn = 'rofi -show combi -modes combi -combi-modes "window,drun,run" -terminal kitty' }
# Window switcher. rofi's window mode binds wlr-foreign-toplevel-management,
# which Rubix serves from src/foreign_toplevel.rs -- without that global rofi
# refuses the mode outright. This is the way back to a window the grid cannot
# reach on its own: fullscreen windows sit outside the tiling grid, and X11
# fullscreen clients are hidden rather than un-fullscreened, so keyboard
# navigation alone never lands on them. Selecting an entry sends `activate`.
"Super+Tab" = { Spawn = "rofi -show window" }
# Clipboard history picker. CopyQ keeps its own global-shortcut settings, but
# they are dead on Wayland -- an XWayland client cannot grab keys for the whole
# session -- so the hotkey has to come from the compositor instead. `menu` pops
# the recent-items list at the pointer; picking an entry puts it on the clipboard
# and closes, so the paste itself is still Ctrl+V. `copyq toggle` instead of
# `menu` opens the full window, which is the one to use for searching or editing
# rather than grabbing the last few things.
#
# copyq itself is started by rubix-session.target (see startup.toml), so this
# bind is a no-op until that target is up.
"Super+v" = { Spawn = "copyq menu" }
# Audio. Bare XF86 media keysyms (resolved case-sensitively by xkb) reach the
# compositor via libinput on the TTY; each Spawns a pactl command against the
# default sink/source. The waybar volume module reacts on its own via `pactl
# subscribe`, so no compositor-side sink handler is needed. pactl matches the
# bar's tooling (@DEFAULT_SINK@).
"XF86AudioRaiseVolume" = { Spawn = "pactl set-sink-volume @DEFAULT_SINK@ +1%" }
"XF86AudioLowerVolume" = { Spawn = "pactl set-sink-volume @DEFAULT_SINK@ -1%" }
"XF86AudioMute" = { Spawn = "pactl set-sink-mute @DEFAULT_SINK@ toggle" }
"XF86AudioMicMute" = { Spawn = "pactl set-source-mute @DEFAULT_SOURCE@ toggle" }
# SDR-white-nits "brightness slider" for HDR outputs (see sdr_white_nits above).
"Super+XF86AudioRaiseVolume" = "IncreaseSdrWhite"
"Super+XF86AudioLowerVolume" = "DecreaseSdrWhite"
# Live HDR on/off toggle for HDR-capable outputs (DP-3) -- flips the connector
# between PQ/BT.2020 and SDR default for instant A/B comparison. Brief panel
# flash on each toggle is normal (connector entering/leaving HDR mode).
"Super+Alt+h" = "ToggleHdr"
# Flip focus-follows-mouse live, for A/B without editing the config. See the
# [input] section above -- a config save re-seeds it from the file.
"Super+Alt+f" = "ToggleFocusFollowsMouse"
# Flip mouse-follows-focus live, same reasoning as Super+Alt+f above -- the two
# can be A/B'd against each other.
"Super+Alt+m" = "ToggleMouseFollowsFocus"
# Lock the focused window solid: fully opaque, no blur or refraction, whatever
# the decoration rules say. Press again to release; closing the window clears
# it. Border rules can match `effects_locked = true` to mark locked windows.
"Super+Alt+o" = "ToggleEffectsLock"
# Screenshots (wlr-screencopy -> grim), on the Scimitar's S1 button via keyd.
# keyd (mouse.conf) emits these chords at the evdev level regardless of WM:
#   S1 tap        -> Super+Ctrl+F1        (was `flameshot gui`)
#   S1 + shift    -> Super+Ctrl+Shift+F1  (was `flameshot full -c`)
# Tap: slurp a region then annotate in satty (saves to ~/Pictures/screenshots,
# copy action uses wl-copy; bails on a cancelled slurp so satty never opens on
# empty input). Shift: whole output straight to the clipboard, no editor -- the
# flameshot-full-c equivalent. Single-quoted TOML literals so "$geom" needs no
# escaping.
"Super+Control+F1" = { Spawn = 'geom=$(slurp) || exit 0; grim -g "$geom" - | satty --filename - --output-filename ~/Pictures/screenshots/satty-$(date +%Y%m%d-%H%M%S).png --early-exit --copy-command wl-copy' }
"Super+Control+Shift+F1" = { Spawn = 'grim - | wl-copy --type image/png' }
# Promote/maximize on the Scimitar's S5 button, matching Awesome's binding in
# devices/scimitar.lua ("S5 tap => promote focused window"). keyd emits the same
# chord from two places: mouse.conf maps S5, and keyboard.conf maps the Tartarus
# enter key, so either reaches this.
# Two-stage, like Awesome's promoteFocusedWindow, but staged by area rather than
# by position: first press fills the window's own group (covering its tiling
# siblings, leaving the other columns visible), second press fills the monitor
# work area, third returns it to its tile. A window alone in its group has no
# siblings to cover, so it skips straight to the monitor stage. Any grid
# movement or focus change drops it back (mirroring the rc.lua unfocus handler).
"Super+Control+F5" = "ToggleMaximize"
# Same ring walked backwards, on Shift + S5: straight to monitor-maximized,
# then back down to the group, then released. keyd emits S5 as a plain macro
# (leftmeta+leftcontrol+f5), so a held Shift rides along and arrives here as
# the shifted chord -- no keyd change needed. F-keys keep their keysym under
# Shift, so unlike the Shift+letter binds above the final token stays "F5".
"Super+Control+Shift+F5" = "ToggleMaximizeReverse"
# Fullscreen windows sit outside the grid entirely, so no directional nav
# chord can reach one once it loses focus. This is the way back.
"Super+f" = "FocusFullscreen"
# Forces the focused window into fullscreen, or back out, even when the client
# never asked. This is how a backgrounded game gets put back on the
# direct-scanout path after losing focus, since fullscreen no longer releases
# on its own.
"Super+Shift+f" = "ToggleFullscreen"
# Closes the focused window, then unconditionally detaches it from the model
# regardless of whether the client actually exits -- the escape hatch for a
# dead or unresponsive window (a frozen client, or one whose server is gone)
# that would otherwise sit on screen forever.
"Super+Escape" = "RemoveWindow"
# The Razer Tartarus keypad lives in tartarus.toml -- 72 binds is enough to
# want its own file. Rubix merges every *.toml here, so the split is cosmetic.

# Exit the compositor. On the TTY backend this is the only in-session quit (winit
# also closes on the host window's close button). Ctrl+Alt+Fn switches VTs.
# Uppercase Q: with Shift held, xkb resolves the key to its shifted symbol, so the
# chord's final token must be the shifted form (matching Alt+Shift+H / +L above).
"Super+Shift+Q" = "Quit"
