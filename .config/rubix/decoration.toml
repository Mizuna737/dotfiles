# Window decoration, animation, and wallpaper.
#
# Every *.toml under this directory is loaded and merged, so the split
# across files is organisational only -- move things wherever suits you.

# Desktop wallpaper, drawn by the compositor itself rather than by a
# layer-shell tool. This is what makes an HDR wallpaper possible: the AVIF
# carries a CICP block naming its transfer function (ST 2084 / PQ here), so it
# is decoded through the PQ inverse EOTF instead of being read as sRGB. swaybg
# has no notion of colour and mpvpaper never tags its surface, so neither can
# do this. Live/hot-reloadable, and settable at runtime over IPC:
#   printf '{"type":"set_wallpaper","path":"/path/img.avif","output":null}\n' | \
#     socat - UNIX-CONNECT:"$XDG_RUNTIME_DIR/rubix.sock"
[wallpaper]
# A directory rather than a file: slideshow over every image in it, sorted,
# `interval_seconds` each. The next image is decoded on a worker thread ahead
# of the swap, so the change itself costs nothing.
path = "~/wallpapers-hdr"
interval_seconds = 180
mode = "Stretch"

# Overall wallpaper brightness on DP-3.
# Turn it UP for a brighter wallpaper, DOWN for a dimmer one.
# Re-decodes the image, so it applies on save.
# Details: rubix docs/brightness-tuning.md
#
# My measurements, on 638321.avif -- the whole HDRTVDM library should track
# it, since it all went through the same conversion. That conversion lifted
# midtones ~10x above where the SDR originals rendered, which is what this
# gain is pulling back. DP-3 peaks at 604 nits.
#   gain  median   p90    p99   peak
#   1.00    31.6  156.6  543.3  2303   (0.68% of pixels above panel peak)
#   0.50    15.8   78.3  271.7  1152   <- current (0.04% above panel peak)
#   0.35    11.0   54.8  190.2   806
#   0.25     7.9   39.1  135.8   576
#   0.15     4.7   23.5   81.5   346
#   SDR      3.1   22.9   91.9   197   (the original .jpg at sdr_white_nits=203)
luminance_scale = 0.15


# Wallpaper brightness on HDMI-A-1 (and in screenshots).
# BACKWARDS: turn it UP to make the wallpaper DARKER, DOWN for brighter.
# It is a reference white, not a brightness. Does nothing on DP-3.
# Takes effect on save. Details: rubix docs/brightness-tuning.md
#
# My measurements. At the 203-nit default this library renders ~2x too
# bright and its shadows ~3.4x too bright, so blacks come out grey.
# Measured against the file's own grading (before luminance_scale), so it
# stays correct when the gain above is retuned.
#   effective ref = this / luminance_scale
#   ref/gain   mean    p5   p50   p90    (sRGB codes; SDR original = 46/16/33/89)
#      203       98    54    80   163
#      600       48    23    38    83
#      800       41    19    32    72
#     2000/g     44    21    34    77   <- current, matches the originals
sdr_reference_nits = 3000.0
[animation]
# Duration of scroll/rotate slide tweens, in milliseconds. Omitting this
# section entirely is fine -- it defaults to 250.
duration_ms = 350

# Window borders, drawn OUTSIDE the client rect over the surrounding gap -- the
# tile keeps its full size and the border eats into inner_gap/outer_gap. Both
# gaps are comfortably above the 2px border here, so nothing collides.
# Fullscreen windows never get a border (it would cost direct scanout).
[decoration]
border_width = 3
# The border ring follows this same curve, staying concentric with the window.
corner_radius = 8
active_color = "#ffb4fa"
inactive_color = "#45475a"

# How brightly the focused window's border glows on DP-3.
# Turn it UP for a more eye-catching focus ring, DOWN for a subtler one.
# Well above sdr_white_nits, so focus is indicated by something SDR chrome
# physically cannot do. Ignored on HDMI-A-1 and in screenshots, which get
# active_color.
active_luminance_nits = 250.0

# Focus glow. 12px of spill sits comfortably inside the 10px inner / 20px outer
# gaps without neighbours bleeding into each other. Only the focused window
# glows -- an unfocused glow on every window is noise, not information.
active_glow_margin = 12
inactive_glow_margin = 0
glow_falloff = 2.0

# Window opacity. Fullscreen windows are always forced opaque regardless of
# these -- a translucent window cannot take direct scanout.
#
# On DP-3 this blends in the linear working space rather than in gamma-encoded
# values, so translucency composites in light.
active_opacity = 0.90
inactive_opacity = 0.75

# Windows buried under a promoted window drop most of the way out, so what shows
# through the promoted window is mostly wallpaper rather than a pile of other
# windows. Drastic on purpose -- tune the number, it hot-reloads.
obscured_opacity = 0.1
obscured_threshold = 0.9
# Backdrop for translucent windows -- what shows through the glass.
# `opacity` is a real transmittance, so an HDR wallpaper reads through a
# window much more strongly than an SDR one at the same setting.
#
# tonemap dims what shows through; blur frosts it. They are independent, so
# bright-but-sharp and dim-but-frosted are both available.
active_backdrop_tonemap = true
inactive_backdrop_tonemap = false
# Frosts the backdrop. On a refracting window the frosting softens the facets
# into vague wobbles, so the two together read weaker than either alone.
active_backdrop_blur = true
inactive_backdrop_blur = false
# How soft the frosting is. Unlike the knobs below this one is not live --
# changing it re-decodes the wallpaper, so expect a hitch on save.
backdrop_blur_radius = 4

# How bright the backdrop may get, in nits. Lower it to push the wallpaper
# back behind text, raise it to let highlights burn through. Above the
# wallpaper's own peak (~460 nits at luminance_scale = 0.2) it does nothing.
# Live -- nudge and save.
backdrop_luminance_nits = 100.0

# Crystal refraction: the wallpaper behind the window looks like it is being
# seen through cut crystal -- broken into flat faces that each shift the
# image, with colour fringing and bright glints where the faces meet.
active_refract = true
inactive_refract = true
# How far each face shifts what shows through, in logical px. Small values
# ripple; past about 25 the wallpaper stops being recognisable.
refract_strength = 20.0
# How large the faces are, in window pixels. Higher gives fewer, broader
# faces. The same on every window regardless of its size, so a value that
# looks right on one window looks right on all of them.
# Live -- nudge and save.
refract_facet_size = 750.0
# How far the colours split apart. 0 is plain colourless glass; raise it for
# rainbow fringing, strongest on the steepest faces. Needs an HDR output to
# show its full range -- on SDR the brightest fringes clip away.
# Live -- nudge and save.
refract_dispersion = 0.6
# Rules apply in file order over the values above, and each changes only the
# fields it names. app_id/title are case-insensitive substring matches.

# Video should never be dimmed or blended -- carried over from the old picom
# config. Title-matched because the browser's app_id is the same whatever tab is
# open, so only the title distinguishes a video from any other page.
# --- Border effects (added 2026-08-28) -------------------------------------
# Animates the ring. "None" (default) is the old static border exactly.
#   Pulse         sinusoidal swell, whole ring in phase
#   Breathing     same swell weighted to dwell low -- breathes, not blinks
#   GradientFlow  travelling wave around the perimeter
#   Comet         bright head chasing a fading tail around the perimeter
active_effect = "Comet"
inactive_effect = "None"

# Cycles per second, and how many times a second the effect is sampled.
# effect_fps is a cost knob: the ring's inputs quantise to it, so at 30 the
# border rebuilds and damages 30x/sec on a 165 Hz panel instead of 165.
effect_speed = 0.2
effect_fps = 60

# THE HDR BIT. The effect swings the border between active_luminance_nits
# (250, above) and this, at CONSTANT HUE -- a pure brightness animation,
# which is the thing SDR chrome physically cannot do.
active_effect_luminance_nits = 600.0

# How far the effect also dips ALPHA at its trough, 0.0-1.0.
# 0.0 = pure luminance animation, nothing but brightness moves.
# Zero: nothing but brightness moves.
#
# Both nit values above are what the border actually EMITS -- 600 is 600
# cd/m^2 whatever the colour. (Before 2026-08-30 they were white-referred and
# a saturated colour landed ~40% under its setting; 400/1000 then is 250/600
# now, which is why these numbers moved without the border changing.)
#
# The panel's measured peak is 604 (EDID HDR Static Metadata, LG ULTRAGEAR+),
# so 600 rides right at the ceiling and anything above it just clips there.
effect_depth = 0.5
# ---------------------------------------------------------------------------

[[decoration.rule]]
title = "youtube"
active_opacity = 1.0
inactive_opacity = 1.0
